name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Syntax check
      run: |
        echo "Checking scraper modules..."
        for dir in Acoustic-*/; do
          if [ -d "$dir" ]; then echo "✅ Found: $dir"; fi
        done
        test -f start_all_scrapers.sh && echo "✅ start_all_scrapers.sh exists"
        test -f stop_all_scrapers.sh && echo "✅ stop_all_scrapers.sh exists"
        test -f run_single_scraper.sh && echo "✅ run_single_scraper.sh exists"
